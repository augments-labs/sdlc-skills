<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Session trace</title>
<!--
  Session trace viewer. Copy this file verbatim next to trace.json; it has
  nothing to fill in. It reads trace.json from its own directory and renders
  it. Every value from the trace reaches the page as text, never as markup:
  the trace describes a transcript, and a transcript holds text nobody here
  wrote. Self-contained: no external script, font, stylesheet, or image.

  Layout: timeline on the left, inspector in the centre, the flow of the
  session on the right, a scrubber and transport below. Playing steps through
  the session, or through one finding's steps.

  Colour has three jobs and no others: blue marks where you are, red marks
  what the diagnosis flags, amber marks what is unsettled. Kinds of event are
  told apart by glyph and name, never by hue.
-->
<style>
  :root {
    color-scheme: dark;
    --canvas: #15161a; --panel: #1b1c21; --raised: #24262c; --selected: #23304a;
    --rule: #32343b; --rule-strong: #6f727b;
    --ink: #ecebe6; --soft: #c6c5bf; --muted: #a09f99;
    --accent: #8fb4f0; --on-accent: #10213d;
    --flag: #f28b7d; --flag-bg: #3a1f1c; --caution: #e0b252;
  }
  :root[data-theme=light] {
    color-scheme: light;
    --canvas: #f5f4f0; --panel: #ffffff; --raised: #eceae4; --selected: #e3ecfb;
    --rule: #dddbd3; --rule-strong: #7d7f86;
    --ink: #1b1c1f; --soft: #43454b; --muted: #5f6167;
    --accent: #1d56b0; --on-accent: #ffffff;
    --flag: #b3261e; --flag-bg: #fbeae8; --caution: #7a5200;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--ink); display: flex; flex-direction: column;
         font: 400 13px/20px -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.g { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .small { font-size: 12px; line-height: 16px; }
  .muted { color: var(--muted); }
  .flag { color: var(--flag); }
  .caution { color: var(--caution); }

  /* ---- header ---- */
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
  header h1 { font-size: 13px; line-height: 20px; font-weight: 600; }
  header .name { flex: 1 1 320px; min-width: 0; color: var(--soft); overflow-wrap: anywhere; }
  .text { border: 0; background: transparent; padding: 0; font-weight: 600; }
  .text:hover { text-decoration: underline; }
  .quiet { border: 1px solid var(--rule-strong); background: transparent; border-radius: 4px; padding: 4px 12px; font-weight: 600; }
  .quiet:hover:not(:disabled) { background: var(--raised); }
  .quiet[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .quiet:disabled { color: var(--muted); border-color: var(--rule); cursor: default; }
  .primary { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 4px; padding: 4px 12px; font-weight: 600; }
  .link { border: 0; background: transparent; padding: 0; color: var(--accent); text-align: left; }
  .link:hover { text-decoration: underline; }

  /* ---- columns ---- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr) 132px; }
  main.walk { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr) 224px; }
  .col { min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  #c-list { border-right: 1px solid var(--rule); }
  #c-flow { border-left: 1px solid var(--rule); }
  #c-view { background: var(--canvas); }
  .head { padding: 12px 16px 8px; border-bottom: 1px solid var(--rule); }
  .head h2 { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .filters { display: flex; gap: 8px; margin-top: 8px; }
  .filters input { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--canvas); }

  /* ---- timeline ---- */
  .label { padding: 12px 16px 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .turn { padding: 8px 16px 4px; margin-top: 4px; border-top: 1px solid var(--rule); font-size: 12px; line-height: 16px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 16px minmax(0, 1fr) max-content; gap: 0 8px; width: 100%; padding: 8px 16px 8px 14px; border: 0;
         border-left: 2px solid transparent; background: transparent; text-align: left; color: var(--soft); }
  .row:hover { background: var(--raised); }
  .row[aria-current=true] { background: var(--selected); border-left-color: var(--accent); }
  .row .g, .row .id { align-self: start; margin-top: 2px; }
  .row .id { color: var(--flag); font-weight: 600; margin-top: 0; }
  .row .ttl { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .ref { font-size: 12px; line-height: 20px; color: var(--muted); text-align: right; white-space: nowrap; }
  .row .pre { grid-column: 2 / 4; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.ahead .ttl { font-weight: 400; color: var(--soft); }
  .row.ahead .g { color: var(--muted); }
  .row.in { padding-left: 30px; }
  .row.finding { grid-template-columns: 22px minmax(0, 1fr); }
  .more { display: block; width: 100%; padding: 4px 16px 4px 40px; border: 0; background: transparent; text-align: left; font-size: 12px; line-height: 16px; color: var(--muted); }
  .more:hover { color: var(--ink); text-decoration: underline; }

  /* ---- inspector ---- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 48px; padding: 8px 24px; border-bottom: 1px solid var(--rule); color: var(--soft); }
  .bar .kind { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .bar .grow { flex: 1; }
  .tag { font-size: 12px; line-height: 16px; font-weight: 600; padding: 0 4px; border-radius: 2px; color: var(--flag); background: var(--flag-bg); }
  .page { max-width: 760px; padding: 24px 24px 64px; font-size: 15px; line-height: 24px; }
  .page h3 { font-size: 20px; line-height: 28px; font-weight: 600; overflow-wrap: anywhere; }
  .sec { margin-top: 24px; }
  .sec.first { margin-top: 16px; }
  .sec.gap { margin-top: 32px; }
  .sec > .t { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .why { border-left: 2px solid var(--accent); padding-left: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .verbatim { position: relative; background: var(--raised); border-radius: 4px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .verbatim.cite { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 20px; color: var(--soft); padding-right: 124px; }
  .verbatim .copy { position: absolute; top: 8px; right: 8px; font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--panel); }
  .two { display: grid; grid-template-columns: 1fr 1fr; }
  .two > div { min-width: 0; padding-right: 24px; }
  .two > div + div { padding: 0 0 0 24px; border-left: 1px solid var(--rule); }
  .two .sec { margin-top: 0; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 24px; font-size: 13px; line-height: 20px; }
  .kv dt { color: var(--muted); }
  .kv dd { overflow-wrap: anywhere; white-space: pre-wrap; }
  .lines > * { display: block; width: 100%; padding: 8px 0; border: 0; border-top: 1px solid var(--rule); background: transparent; text-align: left; font-size: 13px; line-height: 20px; }
  .lines > *:first-child { border-top: 0; padding-top: 0; }
  .lines > button:hover .what { text-decoration: underline; }
  .lines .what { font-weight: 600; overflow-wrap: anywhere; }
  .lines .how { color: var(--muted); overflow-wrap: anywhere; }
  .found { padding: 16px 0; border-top: 1px solid var(--rule); }
  .found:first-child { border-top: 0; padding-top: 0; }
  .found .n { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--flag); }
  .found .n span { color: var(--muted); font-weight: 400; }
  .found .s { display: block; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; font-size: 15px; line-height: 24px; font-weight: 600; overflow-wrap: anywhere; }
  .found .s:hover { text-decoration: underline; }
  .found p { color: var(--soft); overflow-wrap: anywhere; margin: 4px 0 8px; }
  .steps { list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; border-top: 1px solid var(--rule); }
  .steps li:first-child { border-top: 0; }
  .steps button { display: grid; grid-template-columns: 24px minmax(0, 1fr) max-content; gap: 0 12px; width: 100%; padding: 12px 0; border: 0; background: transparent; text-align: left; }
  .steps button::before { content: counter(s); grid-row: 1 / 3; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--muted); text-align: right; }
  .steps button:hover .name { text-decoration: underline; }
  .steps .name { font-size: 13px; line-height: 20px; font-weight: 600; overflow-wrap: anywhere; }
  .steps .ref { font-size: 12px; line-height: 20px; color: var(--muted); white-space: nowrap; }
  .steps .note { grid-column: 2 / 4; color: var(--soft); overflow-wrap: anywhere; font-size: 15px; line-height: 24px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; line-height: 20px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 16px 8px 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
  th { border-top: 0; padding-top: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); }
  ul.plain { padding-left: 20px; }
  ul.plain li { overflow-wrap: anywhere; }
  .hint { margin-top: 32px; color: var(--muted); font-size: 13px; line-height: 20px; }
  .empty { color: var(--muted); padding: 16px; }
  .fail { margin: 24px; padding: 12px 16px; border-left: 2px solid var(--flag); color: var(--ink); font-size: 15px; line-height: 24px; }

  /* ---- flow ---- */
  #flow { padding: 16px 0 8px; display: flex; flex-direction: column; align-items: center; }
  main.walk #flow { align-items: stretch; padding-left: 24px; padding-right: 12px; }
  .hop { position: relative; display: flex; align-items: center; gap: 12px; margin-top: 8px; border: 0; background: transparent; padding: 0; text-align: left; color: var(--soft); }
  .hop:first-child { margin-top: 0; }
  .hop::before { content: ""; position: absolute; left: 13.5px; top: -8px; width: 1px; height: 8px; background: var(--rule-strong); }
  .hop:first-child::before, .hop.after-cut::before, .hop.after-wait::before { display: none; }
  .hop.lane { margin-left: 24px; }
  .hop .box { position: relative; flex: none; width: 28px; height: 28px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--panel); display: grid; place-items: center; }
  .hop:hover .box { background: var(--raised); }
  .hop.ahead { color: var(--muted); }
  .hop.ahead .box { border-color: var(--rule); }
  .hop.cited .box::after { content: ""; position: absolute; top: -3px; right: -3px; width: 6px; height: 6px; background: var(--flag); }
  .hop.absent .box { border: 0; background: transparent; color: var(--flag); }
  .hop[aria-current=true] .box { border: 2px solid var(--accent); color: var(--accent); }
  .hop.absent[aria-current=true] .box { border: 0; outline: 2px solid var(--accent); outline-offset: 2px; }
  .hop .cap { min-width: 0; font-size: 12px; line-height: 16px; }
  .hop .cap b { display: block; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hop.absent .cap b { color: var(--flag); }
  .hop.ahead .cap b { font-weight: 400; color: var(--soft); }
  .wait { margin: 4px 0 0; padding-left: 0; font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; }
  main.walk .wait { text-align: left; padding-left: 40px; }
  .cut { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; border: 0; background: transparent; padding: 4px 8px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .cut::before, .cut::after { content: ""; flex: 1; border-top: 1px dashed var(--rule-strong); }
  .cut:hover { color: var(--ink); }
  .cut[aria-current=true] { color: var(--accent); }
  .cut[aria-current=true]::before, .cut[aria-current=true]::after { border-top-color: var(--accent); }
  .mark { margin-top: 12px; font-size: 12px; line-height: 16px; color: var(--muted); text-align: center; }
  main.walk .mark { text-align: left; }
  .legend { border-top: 1px solid var(--rule); padding: 8px 12px 12px; }
  .legend summary { font-size: 12px; line-height: 16px; color: var(--muted); cursor: pointer; }
  .legend ul { list-style: none; margin-top: 8px; display: grid; gap: 4px; }
  .legend li { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--soft); }
  .legend .sq { width: 6px; height: 6px; margin: 0 5px; background: var(--flag); }

  /* ---- scrubber and transport ---- */
  footer { background: var(--panel); border-top: 1px solid var(--rule); }
  .scrub { padding: 12px 16px 0; }
  .track { position: relative; height: 24px; cursor: pointer; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--rule-strong); }
  .done { position: absolute; left: 0; top: 11px; height: 2px; background: var(--accent); }
  .tick { position: absolute; top: 7px; width: 2px; height: 10px; margin-left: -1px; background: var(--muted); }
  .tick.opens { top: 5px; height: 14px; }
  .tick.cited { background: var(--flag); }
  .tick.ahead { opacity: .7; }
  .head-mark { position: absolute; top: 3px; width: 2px; height: 18px; margin-left: -1px; background: var(--accent); }
  .scale { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .ctrl { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 12px; padding: 8px 16px 12px; }
  .step { width: 28px; height: 28px; border: 1px solid var(--rule-strong); border-radius: 4px; background: transparent; display: grid; place-items: center; padding: 0; }
  .step:hover:not(:disabled) { background: var(--raised); }
  .step:disabled { color: var(--muted); border-color: var(--rule); cursor: default; }
  .play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; padding: 0; }
  .play:disabled { background: var(--raised); color: var(--muted); cursor: default; }
  .play svg.g, .step svg.g { fill: currentColor; stroke: none; }
  .speed { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 0 4px; font-size: 12px; line-height: 20px; color: var(--muted); }
  .speed[aria-pressed=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .status { color: var(--soft); min-width: 0; overflow-wrap: anywhere; }
  .keys { font-size: 12px; line-height: 16px; color: var(--muted); }
  .keys kbd { font: inherit; border: 1px solid var(--rule-strong); border-radius: 2px; padding: 0 4px; }

  #tabs { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  @media (max-width: 1080px) { .keys { display: none; } main, main.walk { grid-template-columns: minmax(260px, 320px) minmax(0, 1fr) 132px; } main.walk #flow .cap { display: none; } main.walk #flow { align-items: center; padding-left: 0; padding-right: 0; } main.walk .wait, main.walk .mark { text-align: center; padding-left: 0; } }
  @media (max-width: 800px) {
    html, body { height: auto; }
    body { display: block; }
    main, main.walk { display: block; }
    .col { display: none; border: 0; }
    body[data-tab=list] #c-list, body[data-tab=view] #c-view, body[data-tab=flow] #c-flow { display: block; }
    .scroll { overflow: visible; }
    .two { grid-template-columns: 1fr; }
    .two > div { padding-right: 0; }
    .two > div + div { padding: 24px 0 0; border-left: 0; }
    .page { padding: 16px 16px 48px; }
    .bar { padding: 8px 16px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
    .scrub { padding: 8px 16px 0; }
    .ctrl { padding: 4px 16px 8px; gap: 4px 12px; }
    .speed { display: none; }
    .speed[aria-pressed=true] { display: inline-block; }
    #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); }
    #tabs button { border: 0; border-top: 2px solid transparent; background: transparent; padding: 8px 0; color: var(--muted); font-weight: 600; }
    #tabs button[aria-pressed=true] { color: var(--ink); border-top-color: var(--accent); }
    main.walk #flow, #flow { align-items: stretch; padding-left: 24px; padding-right: 16px; }
    main.walk #flow .cap, #flow .cap { display: block; }
    main.walk .wait, .wait { text-align: left; padding-left: 40px; }
    main.walk .mark, .mark { text-align: left; }
    .row, .hop, .found, .steps li { scroll-margin-bottom: 200px; }
  }
</style>
</head>
<body data-tab="view">
<header>
  <h1>Session trace</h1>
  <span class="name" id="name"></span>
  <button type="button" class="text flag" id="verdict"></button>
  <button type="button" class="quiet" id="theme">Light theme</button>
</header>
<main id="main">
  <section class="col" id="c-list" aria-label="Timeline">
    <div class="head">
      <h2>Timeline</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Search events" aria-label="Search events">
        <button type="button" class="quiet" id="only" aria-pressed="false">Cited or failed only</button>
      </div>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <section class="col" id="c-view" aria-label="Inspector">
    <div class="bar" id="bar"></div>
    <div class="scroll" id="view"><div class="page" id="detail"></div></div>
  </section>
  <section class="col" id="c-flow" aria-label="Flow">
    <div class="head"><h2>Flow</h2></div>
    <div class="scroll"><div id="flow"></div></div>
    <details class="legend" id="legend"><summary>What the marks mean</summary></details>
  </section>
</main>
<footer id="foot">
  <div class="scrub">
    <div class="track" id="track"><div class="done" id="done"></div></div>
    <div class="scale"><span class="mono" id="s0"></span><span id="pos"></span><span class="mono" id="s1"></span></div>
  </div>
  <div class="ctrl">
    <button type="button" class="step" id="prev" aria-label="Previous step"></button>
    <button type="button" class="play" id="play" aria-label="Play"></button>
    <button type="button" class="step" id="next" aria-label="Next step"></button>
    <span id="speeds"></span>
    <span class="status" id="status"></span>
    <span class="keys"><kbd>Space</kbd> play or pause, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> step, <kbd>Esc</kbd> overview</span>
  </div>
  <div id="tabs">
    <button type="button" data-tab="list">Timeline</button>
    <button type="button" data-tab="view">Inspector</button>
    <button type="button" data-tab="flow">Flow</button>
  </div>
</footer>
<div class="sr" id="live" aria-live="polite"></div>
<noscript><p class="fail">This viewer needs JavaScript. The diagnosis report beside it holds the same findings as text.</p></noscript>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var KINDS = ['prompt', 'reply', 'skill', 'gate', 'tool', 'decision', 'write', 'dispatch', 'boundary', 'other'];
  var NAME = { prompt: 'User prompt', reply: 'Agent reply', skill: 'Skill', gate: 'Gate', tool: 'Tool call', decision: 'Decision',
               write: 'Write', dispatch: 'Subagent dispatch', boundary: 'Context boundary', other: 'Event' };
  var PATHS = { prompt: 'M5 4l4 4-4 4', reply: 'M3 5h10M3 8h10M3 11h6', skill: 'M8 2l5.2 3v6L8 14l-5.2-3V5z', gate: 'M4 3v10M12 3v10M4 8h8',
                tool: 'M3 8h10M9 4l4 4-4 4', decision: 'M8 2.5l5.5 5.5L8 13.5 2.5 8z', write: 'M3 13l1-3.5L10.5 3l2.5 2.5L6.5 12z',
                dispatch: 'M4 3v10M4 8h5a3 3 0 0 0 3-3V3', boundary: 'M2 8h3M7 8h2M11 8h3' };
  var STATUSES = ['ok', 'error', 'unanswered', 'missing', 'unknown'];
  var SPEEDS = [0.5, 1, 2, 4];
  var LIMIT = 20000;
  // sel: {type:'root'} | {type:'finding', f} | {type:'event', i}; pos is the place in what is being stepped through
  var state = { trace: null, events: [], findings: [], sel: { type: 'root' }, walk: null, pos: -1, playing: false, speed: 1, timer: null,
                q: '', only: false, open: {}, dup: [] };
  var $ = function (id) { return document.getElementById(id); };

  /* mask:start */
  // A net under the rule that no sensitive value is written to the trace:
  // what has the shape of a credential is masked before it is shown or
  // copied. It is a net, not the rule: it knows shapes, not meaning, and it

    sec(d, 'Session', kv, 'gap');
    if (state.dup.length) sec(d, 'A fault in the trace', el('div', 'body', 'These event ids are used more than once: ' + state.dup.join(', ') + '. A finding that names one of them points at the first event with that id.'));
    d.appendChild(el('p', 'hint', 'This page shows the events the diagnosis cited, not the whole transcript. An event that is absent was not searched for, or not found. Text that has the shape of a credential is masked on this page; the masking is a net, and it does not change the files.'));
  }

  function viewFinding(d, f) {
    setBar([add(el('span', 'kind flag'), el('span', '', 'Finding ' + (f.n + 1))), el('span', '', str(f.dimension)), el('span', 'grow'),
      f.path.length > 1 ? btn('primary', 'Replay the ' + plural(f.path.length, 'step'), function () { replay(f); }) : null]);
    d.appendChild(el('h3', '', str(f.statement)));
    sec(d, 'What the record shows', body(f.shows), 'first');
    sec(d, 'How it produced what you saw', body(f.consequence));
    if (f.path.length) {
      var ol = el('ol', 'steps');
      f.path.forEach(function (s, p) {
        var e = state.events[s.i], b = btn('', '', function () { stop(); state.walk = f; build(); go(p); if (narrow()) tab('view'); });
        add(b, el('span', 'name', str(e.title)), el('span', 'ref mono', (clock(e.time) ? clock(e.time) + '  ' : '') + 'L' + mask(str(e.line))), el('span', 'note', s.note));
        ol.appendChild(add(el('li'), b));
      });
      sec(d, 'How it happened, step by step', ol, 'gap');
    }
    var ev = list(f.evidence).filter(obj);
    if (!ev.length) sec(d, 'Evidence', el('div', 'why flag', 'No citation. This finding is unsupported and should not be here.'), 'gap');
    ev.forEach(function (x, n) { cite(d, x.line, x.fragment, x.file, n ? '' : 'gap'); });
  }

  function viewEvent(d, e, i) {
    var f = state.walk, p = here(), seq = sequence(), k = kindOf(e), marks = e.cited.map(function (x) { return 'F' + (x.n + 1); });
    var meta = [p >= 0 ? 'step ' + (p + 1) + ' of ' + seq.length : '', clock(e.time), span(e.duration_ms), 'line ' + mask(str(e.line))].filter(Boolean).join('  ·  ');
    setBar([add(el('span', 'kind'), glyph(e), el('span', '', absent(e) ? NAME[k] + ' that did not happen' : NAME[k])),
      bad(e) && !absent(e) ? el('span', statusOf(e) === 'error' ? 'tag' : 'caution', statusOf(e)) : null,
      !bad(e) && statusOf(e) === 'unknown' ? el('span', 'caution', 'result unknown') : null,
      marks.length ? el('span', 'flag', 'cited by ' + marks.join(', ')) : null,
      el('span', 'small muted', meta), el('span', 'grow'),
      f ? btn('link', 'Finding ' + (f.n + 1), function () { pick({ type: 'finding', f: f }); }) : null]);
    d.appendChild(el('h3', '', str(e.title)));
    if (f && p >= 0 && f.path[p] && f.path[p].note) sec(d, 'Why this step matters', el('div', 'why', f.path[p].note), 'first');
    sec(d, 'The user wrote', str(e.quote) ? el('div', 'verbatim', e.quote) : null);
    sec(d, absent(e) ? 'What the record holds' : 'What happened', body(e.summary));
    sec(d, 'What should have happened', body(e.expected));
    if (str(e.input) || str(e.result)) {
      var two = el('div', 'two sec'), a = el('div'), b = el('div');
      sec(a, 'Input', el('div', 'body', str(e.input) || 'not recorded'));
      sec(b, 'Output', el('div', 'body', str(e.result) || 'not recorded'));
      d.appendChild(add(two, a, b));
    }
    cite(d, e.line, e.fragment, e.file, 'gap');

    var kv = el('dl', 'kv'), any = false;
    [['Time', str(e.time), 1], ['Took', span(e.duration_ms)], ['Thread', threadOf(e)], ['Skill', e.skill, 1], ['Tool', e.tool],
     ['Result at', str(e.result_line) ? 'line ' + str(e.result_line) : ''], ['Branch', e.branch, 1], ['Directory', e.cwd, 1],
     ['Inside', e.inside >= 0 ? str(state.events[e.inside].title) : ''],
     ['Files', list(e.files).filter(function (x) { return typeof x === 'string'; }).join('\n'), 1]].forEach(function (x) {
      if (!str(x[1])) return;
      any = true;
      add(kv, el('dt', '', x[0]), el('dd', x[2] ? 'mono' : '', str(x[1])));
    });
    if (any) sec(d, 'Attributes', kv);
    if (e.links.length || e.cited.length) {
      var rows = el('div', 'lines');
      e.links.forEach(function (r) { rows.appendChild(lineTo(state.events[r.i], r.i, r.relation)); });
      e.cited.forEach(function (x) {
        var l = btn('', '', function () { pick({ type: 'finding', f: x }); });
        add(l, el('div', 'what', 'Finding ' + (x.n + 1) + ': ' + str(x.statement)), el('div', 'how', str(x.dimension)));
        rows.appendChild(l);
      });
      sec(d, 'Connected to', rows);
    }
  }

  function renderView() {
    var d = $('detail'), s = state.sel;
    clear(d);
    if (s.type === 'finding') viewFinding(d, s.f);
    else if (s.type === 'event' && state.events[s.i]) viewEvent(d, state.events[s.i], s.i);
    else viewRoot(d);
    $('view').scrollTop = 0;
    if (narrow() && document.body.dataset.tab === 'view') window.scrollTo(0, 0);
  }

  /* ---------- wiring ---------- */
  function keep(n) {
    if (!n) return;
    var pane = n.closest('.scroll');
    if (!pane || pane.scrollHeight <= pane.clientHeight + 1) { if (narrow() && n.offsetParent) n.scrollIntoView({ block: 'nearest' }); return; }
    var top = n.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
    if (top < pane.scrollTop + 32) pane.scrollTop = Math.max(0, top - 64);
    else if (top + n.offsetHeight > pane.scrollTop + pane.clientHeight - 16) pane.scrollTop = top + n.offsetHeight - pane.clientHeight + 64;
  }
  // build() draws the rows, hops and ticks; paint() only moves the marks, so
  // a step keeps the controls, and the focus, where they are.
  function build() { renderList(); renderFlow(); renderTicks(); paint(); }
  function paint() {
    var s = state.sel, cur = null, curHop = null;
    Array.prototype.forEach.call($('list').querySelectorAll('.row'), function (r) {
      var on = (r.dataset.root && s.type === 'root') || (r.dataset.f !== undefined && s.type === 'finding' && Number(r.dataset.f) === s.f.n) ||
               (r.dataset.i !== undefined && s.type === 'event' && Number(r.dataset.i) === s.i);
      if (on) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current');
      if (r.dataset.i !== undefined && !r.dataset.out) r.classList.toggle('ahead', ahead(Number(r.dataset.i)));
      if (on) cur = r;
    });
    Array.prototype.forEach.call($('flow').querySelectorAll('.hop, .cut'), function (h) {
      var on = s.type === 'event' && (h.dataset.p !== undefined ? Number(h.dataset.p) === state.pos : Number(h.dataset.i) === s.i);
      if (on) h.setAttribute('aria-current', 'true'); else h.removeAttribute('aria-current');
      h.classList.toggle('ahead', s.type === 'event' && !!(state.walk || state.playing) &&
        (h.dataset.p !== undefined ? Number(h.dataset.p) : sequence().indexOf(Number(h.dataset.i))) > state.pos);
      if (on) curHop = h;
    });
    Array.prototype.forEach.call($('track').querySelectorAll('.tick'), function (t) { t.classList.toggle('ahead', Number(t.dataset.p) > here()); });
    renderTransport();
    renderView();
    keep(cur); keep(curHop);
    if (s.type === 'event') $('live').textContent = mask('Step ' + (state.pos + 1) + ' of ' + sequence().length + ': ' + str(state.events[s.i].title));
  }
  function remember() {
    var s = state.sel, parts = [];
    if (state.walk) parts.push('finding=' + (state.walk.n + 1));
    else if (s.type === 'finding') parts.push('finding=' + (s.f.n + 1));
    if (s.type === 'event') parts.push(state.walk ? 'step=' + (state.pos + 1) : 'event=' + (s.i + 1));
    try { history.replaceState(null, '', location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '')); } catch (e) { /* sandbox */ }
  }
  function tab(name) {
    document.body.dataset.tab = name;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-pressed', b.dataset.tab === name ? 'true' : 'false'); });
    room();
  }
  function room() { document.body.style.paddingBottom = narrow() ? ($('foot').offsetHeight + 16) + 'px' : ''; }
  // a choice made by the user: it ends any replay and, on a phone, opens the inspector
  function pick(sel) {
    stop();
    var was = state.walk;
    state.sel = sel;
    if (sel.type === 'finding') { state.walk = sel.f; state.pos = -1; }
    else if (sel.type === 'root') { state.walk = null; state.pos = -1; }
    else {
      var p = sequence().indexOf(sel.i);
      if (p < 0) { state.walk = null; p = sel.i; }
      state.pos = p;
    }
    if (narrow()) tab('view');
    remember();
    if (was !== state.walk) build(); else paint();
  }
  function pickStep(i, p) {
    if (p < 0 || !state.walk) { pick({ type: 'event', i: i }); return; }
    stop();
    go(p);
    if (narrow()) tab('view');
  }
  // a move of the playhead: it changes no tab and ends no replay
  function go(p) {
    var seq = sequence();
    if (p < 0 || p >= seq.length) return false;
    state.pos = p;
    state.sel = { type: 'event', i: seq[p] };
    remember();
    paint();
    return true;
  }
  function stop() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = null;
    if (state.playing) { state.playing = false; paint(); }
  }
  function tick() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = setTimeout(function () {
      state.timer = null;
      if (!state.playing) return;
      if (!go(state.pos + 1) || state.pos >= sequence().length - 1) { stop(); return; }
      tick();
    }, 2200 / state.speed);
  }
  function start() {
    var seq = sequence();
    if (seq.length < 2) return;
    if (here() < 0 || here() >= seq.length - 1) go(0);
    state.playing = true;
    paint();
    tick();
  }
  function replay(f) { stop(); state.walk = f; state.pos = -1; state.sel = { type: 'finding', f: f }; build(); go(0); start(); if (narrow()) tab('view'); }
  function restore() {
    var want = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (p) {
      var i = p.indexOf('=');
      if (i <= 0) return;
      try { want[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) { /* a broken pair is ignored */ }
    });
    if (want.theme === 'light' || want.theme === 'dark') theme(want.theme, false);
    var f = state.findings[Number(want.finding) - 1], e = Number(want.event) - 1, s = Number(want.step) - 1;
    if (f && f.path[s]) { state.walk = f; build(); go(s); }
    else if (f && state.events[e] && f.path.some(function (x) { return x.i === e; })) { state.walk = f; build(); pick({ type: 'event', i: e }); }
    else if (state.events[e]) { build(); pick({ type: 'event', i: e }); }
    else if (f) { state.walk = f; state.sel = { type: 'finding', f: f }; build(); }
    else build();
    if (want.tab === 'list' || want.tab === 'flow' || want.tab === 'view') tab(want.tab); else tab('view');
    if (want.play === '1') { if (here() >= 0 && here() < sequence().length - 1) { state.playing = true; paint(); tick(); } else start(); }
  }
  function begin(trace) {
    if (!obj(trace) || trace.schema !== 'session-trace/1' || !Array.isArray(trace.events)) {
      fail('trace.json is not a session-trace/1 file. The diagnosis report beside it holds the findings as text.');
      return;
    }
    load(trace);
    var s = trace.session || {};
    if (str(s.symptom)) document.title = 'Session trace: ' + mask(str(s.symptom)).slice(0, 60);
    icon('prev', 'M3 3h2v10H3zM13 3L6 8l7 5z');
    icon('next', 'M11 3h2v10h-2zM3 3l7 5-7 5z');
    SPEEDS.forEach(function (v) {
      var b = btn('speed', v + 'x', function () { state.speed = v; if (state.playing) tick(); renderTransport(); });
      b.dataset.v = v;
      $('speeds').appendChild(b);
    });
    renderHead();
    renderLegend();
    restore();

    $('verdict').addEventListener('click', function () { pick({ type: 'root' }); });
    $('q').addEventListener('input', function (ev) { state.q = ev.target.value; build(); });
    $('only').addEventListener('click', function () {
      state.only = !state.only; $('only').setAttribute('aria-pressed', state.only ? 'true' : 'false'); build();
    });
    $('prev').addEventListener('click', function () { stop(); go(here() - 1); if ($('prev').disabled) $('play').focus(); });
    $('next').addEventListener('click', function () { stop(); go(here() + 1); if ($('next').disabled) $('play').focus(); });
    $('play').addEventListener('click', function () { if (state.playing) stop(); else start(); });
    $('track').addEventListener('click', function (ev) {
      var seq = sequence(), r = $('track').getBoundingClientRect();
      if (!seq.length || !r.width) return;
      stop();
      go(Math.max(0, Math.min(seq.length - 1, Math.round((ev.clientX - r.left) / r.width * (seq.length - 1)))));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.addEventListener('click', function () { tab(b.dataset.tab); window.scrollTo(0, 0); });
    });
    window.addEventListener('resize', room);
    document.addEventListener('keydown', function (ev) {
      if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
      var t = ev.target && ev.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if (ev.key === ' ') { if (t === 'BUTTON' || t === 'SUMMARY') return; ev.preventDefault(); if (state.playing) stop(); else start(); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); stop(); go(here() < 0 ? 0 : here() + 1); }
      else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stop(); go(here() - 1); }
      else if (ev.key === 'Escape') { pick({ type: 'root' }); }
    });
  }

  fetch('trace.json', { cache: 'no-store', credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.json(); })
    .then(function (trace) {
      try { begin(trace); }
      catch (e) { fail('trace.json was read, but the page could not show it. The diagnosis report beside it holds the findings as text.'); }
    }, function () {
      fail('trace.json could not be read. Open this page through the preview URL, not as a file, and check that trace.json sits beside it.');
    });
})();
</script>
</body>
</html>
