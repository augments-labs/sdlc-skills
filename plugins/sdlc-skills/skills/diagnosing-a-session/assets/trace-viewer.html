<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Tqx4uWuXxyjqU0fReAGqOALpSmi1D0uuJc5QvOIPgSY='; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Session trace</title>
<!--
  Session trace viewer. Copy this file verbatim next to trace.json; it has
  nothing to fill in. It reads trace.json from its own directory and renders
  it. Every value from the trace reaches the page as text, never as markup:
  the trace describes a transcript, and a transcript holds text nobody here
  wrote. Self-contained: no external script, font, stylesheet, or image.

  Layout: a replay studio. Timeline on the left, inspector in the centre,
  the flow of the session on the right, a scrubber and play controls below.
  Playing steps through the session, or through one finding's steps.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #07080c; --panel: #0b0d13; --raised: #11141c; --hover: #151926; --line: #1b1f2b; --line2: #262b3a;
    --ink: #e8eaf0; --soft: #aab0c0; --muted: #8b92a6;
    --accent: #22d3ee; --accent-ink: #04222a; --accent-bg: #0b2a33;
    --ok: #34d399; --ok-bg: #0a2a20; --err: #fb7185; --err-bg: #2b1019; --warn: #fbbf24; --warn-bg: #2b2108;
    --k-prompt: #f472b6; --k-reply: #a78bfa; --k-skill: #c084fc; --k-gate: #34d399; --k-tool: #fbbf24;
    --k-decision: #fb923c; --k-write: #38bdf8; --k-dispatch: #2dd4bf; --k-boundary: #94a3b8; --k-other: #94a3b8;
  }
  :root[data-theme=light] {
    color-scheme: light;
    --bg: #f4f5f7; --panel: #ffffff; --raised: #f6f7f9; --hover: #eef0f4; --line: #e3e5ea; --line2: #d3d6de;
    --ink: #14161c; --soft: #3f4454; --muted: #5b6276;
    --accent: #0e7490; --accent-ink: #ffffff; --accent-bg: #e0f5fa;
    --ok: #047857; --ok-bg: #e7f7f0; --err: #be123c; --err-bg: #fdecef; --warn: #92580a; --warn-bg: #fdf6dc;
    --k-prompt: #be185d; --k-reply: #6d28d9; --k-skill: #9333ea; --k-gate: #047857; --k-tool: #92580a;
    --k-decision: #c2410c; --k-write: #0369a1; --k-dispatch: #0f766e; --k-boundary: #55607a; --k-other: #55607a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p, dl, dd, ol { margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  svg.g { width: 14px; height: 14px; fill: currentColor; }
  .cap { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- header ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 280px; }
  .brand .pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand h1 { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .brand .name { color: var(--soft); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 20px; }
  .stat .cap { display: block; font-size: 10px; }
  .stat b { font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat.bad b { color: var(--err); }
  .pill { border: 1px solid; border-radius: 999px; padding: 2px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .pill.bad { color: var(--err); background: var(--err-bg); border-color: var(--err); }
  .pill.good { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .ghost { border: 1px solid var(--line2); background: transparent; border-radius: 8px; padding: 3px 10px; font-size: 12.5px; color: var(--soft); }
  .ghost:hover { background: var(--hover); }

  /* ---- three columns ---- */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr) 132px; }
  .col { min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  #c-list { border-right: 1px solid var(--line); }
  #c-flow { border-left: 1px solid var(--line); }
  #c-view { background: var(--bg); }
  .colhead { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  .colhead .n { color: var(--muted); font-size: 12px; }
  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .filters { display: flex; gap: 6px; margin-top: 8px; }
  .filters input { flex: 1; min-width: 0; padding: 4px 9px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); font-size: 13px; }
  .filters input::placeholder { color: var(--muted); opacity: 1; }
  .filters .ghost[aria-pressed=true] { color: var(--err); border-color: var(--err); background: var(--err-bg); }

  /* ---- timeline rows ---- */
  .row { display: grid; grid-template-columns: 10px 22px minmax(0, 1fr) max-content; gap: 0 8px; align-items: baseline; width: 100%;
         padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); border-left: 2px solid transparent;
         background: transparent; text-align: left; transition: opacity .2s, background .15s; }
  .row:hover { background: var(--hover); }
  .row[aria-current=true] { background: var(--accent-bg); border-left-color: var(--accent); }
  .row.ahead { opacity: .5; }
  .row.in { padding-left: 30px; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; align-self: center; }
  .row .num { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .row .ttl { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tags { display: flex; gap: 4px; align-items: center; }
  .row .pre { grid-column: 3 / 5; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.finding .dot { border-radius: 2px; transform: rotate(45deg); }
  .turn { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; padding: 4px 12px; background: var(--raised);
          border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
  .more { display: block; width: 100%; padding: 6px 12px 6px 52px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
          text-align: left; font-size: 12px; color: var(--accent); }
  .more:hover { background: var(--hover); }
  .skip { padding: 3px 12px 3px 52px; border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--muted); }

  .k-prompt { color: var(--k-prompt); } .k-reply { color: var(--k-reply); } .k-skill { color: var(--k-skill); }
  .k-gate { color: var(--k-gate); } .k-tool { color: var(--k-tool); } .k-decision { color: var(--k-decision); }
  .k-write { color: var(--k-write); } .k-dispatch { color: var(--k-dispatch); } .k-boundary { color: var(--k-boundary); }
  .k-other { color: var(--k-other); } .k-issue { color: var(--err); } .k-root { color: var(--accent); }

  .tag { display: inline-block; font-size: 11px; font-weight: 650; line-height: 17px; padding: 0 6px; border-radius: 5px; white-space: nowrap; }
  .tag.error, .tag.missing, .tag.issue { background: var(--err-bg); color: var(--err); }
  .tag.unanswered, .tag.unknown { background: var(--warn-bg); color: var(--warn); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }

  /* ---- inspector ---- */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 22px; border-bottom: 1px solid var(--line); min-height: 50px; }
  .badge { border-radius: 6px; padding: 2px 10px; font-size: 12.5px; font-weight: 650; background: var(--raised); border: 1px solid var(--line2); }
  .bar .meta { color: var(--muted); font-size: 12.5px; }
  .bar .grow { flex: 1; }
  .page { max-width: 940px; padding: 20px 22px 60px; }
  .page h3 { font-size: 21px; line-height: 1.3; font-weight: 650; overflow-wrap: anywhere; }
  .page h3:focus { outline: none; }
  .sec { margin-top: 22px; }
  .sec > .cap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sec > .cap .grow { flex: 1; }
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .card.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: var(--soft); }
  .card.q { border-left: 3px solid var(--k-prompt); }
  .card.want { border-left: 3px solid var(--ok); }
  .card.saw { border-left: 3px solid var(--err); }
  .card.why { border-color: var(--accent); background: var(--accent-bg); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pair > div { min-width: 0; }
  .pair .sec { margin-top: 22px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 18px; }
  .kv dt { color: var(--muted); }
  .kv dd { overflow-wrap: anywhere; white-space: pre-wrap; }
  .btn { border: 1px solid var(--line2); background: var(--raised); border-radius: 8px; padding: 4px 12px; font-size: 13px; white-space: nowrap;
         text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 500; }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .links > button { display: block; width: 100%; padding: 9px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
  .links > button:last-child { border-bottom: 0; }
  .links > button:hover { background: var(--hover); }
  .links .small { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .listcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .found { margin-top: 12px; border: 1px solid var(--line); border-left: 3px solid var(--err); border-radius: 10px; background: var(--panel); padding: 14px 16px; }
  .found h4 { font-size: 15.5px; margin: 3px 0 6px; overflow-wrap: anywhere; font-weight: 650; }
  .found p { color: var(--soft); overflow-wrap: anywhere; }
  .found .act { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .steps { list-style: none; padding: 0; counter-reset: s; }
  .steps li { counter-increment: s; }
  .steps button { display: grid; grid-template-columns: 28px minmax(0, 1fr) max-content; gap: 2px 10px; width: 100%; padding: 10px 14px; border: 0;
                  border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
  .steps li:last-child button { border-bottom: 0; }
  .steps button:hover { background: var(--hover); }
  .steps button::before { content: counter(s); grid-row: 1 / 3; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
                          font-size: 12px; font-weight: 700; background: var(--raised); border: 1px solid var(--line2); color: var(--soft); }
  .steps .name { font-weight: 600; overflow-wrap: anywhere; }
  .steps .ref { color: var(--muted); font-size: 12px; }
  .steps .note { grid-column: 2 / 4; color: var(--soft); overflow-wrap: anywhere; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: 8px 14px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--raised); }
  ul.plain { margin: 0; padding: 12px 14px 12px 32px; }
  ul.plain li { overflow-wrap: anywhere; }
  .hint { margin-top: 22px; color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 16px 14px; }
  .fail { margin: 24px; padding: 12px 14px; border-radius: 10px; background: var(--err-bg); color: var(--err); }

  /* ---- flow ---- */
  #flow { padding: 18px 0 30px; display: flex; flex-direction: column; align-items: center; }
  .hop { position: relative; width: 38px; height: 38px; margin-top: 14px; border-radius: 11px; border: 1px solid var(--line2); background: var(--raised);
         display: grid; place-items: center; padding: 0; font-size: 16px; line-height: 1; transition: opacity .2s, transform .15s, box-shadow .15s; }
  .hop:first-child { margin-top: 0; }
  .hop::before { content: ""; position: absolute; left: 50%; top: -15px; width: 1px; height: 14px; background: var(--line2); }
  .hop:first-child::before, .hop.after-mark::before { display: none; }
  .hop:hover { transform: scale(1.08); }
  .hop.ahead { opacity: .32; }
  .hop.cited { border-color: var(--err); }
  .hop.absent { border-style: dashed; border-color: var(--err); background: transparent; color: var(--err); }
  .hop[aria-current=true] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-bg), 0 0 14px var(--accent); opacity: 1; }
  .mark { margin-top: 16px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mark:first-child { margin-top: 0; }

  /* ---- scrubber and controls ---- */
  footer { background: var(--panel); border-top: 1px solid var(--line); }
  .scrub { padding: 14px 18px 4px; }
  .track { position: relative; height: 22px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); cursor: pointer; }
  .done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 11px; background: var(--accent-bg); border-right: 1px solid var(--accent);
          transition: width .25s ease; }
  .tick { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: currentColor;
          transition: transform .15s, opacity .2s; }
  .tick.ahead { opacity: .45; }
  .tick.cited { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--err); }
  .tick.now { transform: scale(1.7); opacity: 1; box-shadow: 0 0 10px currentColor; }
  .scale { display: flex; justify-content: space-between; margin-top: 5px; color: var(--muted); font-size: 11.5px; }
  .ctrl { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; padding: 6px 18px 14px; }
  .step { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line2); background: var(--raised); display: grid; place-items: center; padding: 0; }
  .step:hover:not(:disabled) { background: var(--hover); }
  .step:disabled { opacity: .35; cursor: default; }
  .play { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; padding: 0; box-shadow: 0 0 16px var(--accent-bg); }
  .play:disabled { opacity: .35; cursor: default; box-shadow: none; }
  .speed { border: 0; background: transparent; border-radius: 6px; padding: 2px 8px; color: var(--muted); font-size: 12.5px; }
  .speed[aria-pressed=true] { background: var(--accent-bg); color: var(--accent); font-weight: 650; }
  .status { color: var(--soft); font-size: 12.5px; }
  .keys { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .keys kbd { font: inherit; border: 1px solid var(--line2); border-radius: 5px; padding: 0 6px; background: var(--raised); color: var(--soft); }

  #tabs { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 1080px) { main { grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) 84px; } .keys { display: none; } }
  @media (max-width: 800px) {
    html, body { height: auto; }
    body { display: block; }
    main { display: block; }
    .col { display: none; border: 0; }
    body[data-tab=list] #c-list, body[data-tab=view] #c-view, body[data-tab=flow] #c-flow { display: block; }
    .scroll { overflow: visible; }
    .pair { grid-template-columns: 1fr; gap: 0; }
    .page { padding: 16px 16px 40px; }
    .bar { padding: 10px 16px; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
    .scrub { padding: 10px 14px 2px; }
    .ctrl { padding: 4px 14px 8px; }
    .step { width: 36px; height: 36px; }
    .speed { min-width: 32px; line-height: 28px; }
    #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
    #tabs button { border: 0; background: transparent; padding: 9px 0; color: var(--muted); font-size: 12.5px; font-weight: 600; }
    #tabs button[aria-pressed=true] { color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
    #flow { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 12px; padding: 16px; }
    .hop, .hop:first-child { margin: 0; }
    .hop::before { display: none; }
    .mark, .mark:first-child { width: 100%; margin: 6px 0 0; }
    .row, .hop, .found, .steps li { scroll-margin-bottom: 200px; }
  }
</style>
</head>
<body data-tab="view">
<header>
  <div class="brand">
    <span class="pulse" aria-hidden="true"></span>
    <h1>Session trace</h1>
    <span class="name" id="name"></span>
  </div>
  <div class="stats" id="stats"></div>
  <button type="button" class="pill" id="verdict" hidden></button>
  <button type="button" class="ghost" id="theme">Light theme</button>
</header>
<main id="main">
  <section class="col" id="c-list" aria-label="Timeline">
    <div class="colhead">
      <h2 class="cap">Timeline</h2>
      <div class="n" id="count"></div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search" aria-label="Search events">
        <button type="button" class="ghost" id="only" aria-pressed="false">Problems</button>
      </div>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <section class="col" id="c-view" aria-label="Inspector">
    <div class="bar" id="bar"></div>
    <div class="scroll" id="view"><div class="page" id="detail"></div></div>
  </section>
  <section class="col" id="c-flow" aria-label="Flow">
    <div class="colhead"><h2 class="cap">Flow</h2></div>
    <div class="scroll"><div id="flow"></div></div>
  </section>
</main>
<footer id="foot">
  <div class="scrub">
    <div class="track" id="track"><div class="done" id="done"></div></div>
    <div class="scale"><span class="mono" id="s0"></span><span id="pos"></span><span class="mono" id="s1"></span></div>
  </div>
  <div class="ctrl">
    <button type="button" class="step" id="prev" aria-label="Previous step"></button>
    <button type="button" class="play" id="play" aria-label="Play"></button>
    <button type="button" class="step" id="next" aria-label="Next step"></button>
    <span id="speeds"></span>
    <span class="status" id="status"></span>
    <span class="keys"><kbd>Space</kbd> play &middot; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> step &middot; <kbd>Esc</kbd> overview</span>
  </div>
  <div id="tabs">
    <button type="button" data-tab="list">Timeline</button>
    <button type="button" data-tab="view">Inspector</button>
    <button type="button" data-tab="flow">Flow</button>
  </div>
</footer>
<div class="sr" id="live" aria-live="polite"></div>
<noscript><p class="fail">This viewer needs JavaScript. The diagnosis report beside it holds the same findings as text.</p></noscript>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var KINDS = ['prompt', 'reply', 'skill', 'gate', 'tool', 'decision', 'write', 'dispatch', 'boundary', 'other'];
  var NAME = { prompt: 'User prompt', reply: 'Agent reply', skill: 'Skill', gate: 'Gate', tool: 'Tool call', decision: 'Decision',
               write: 'Write', dispatch: 'Subagent dispatch', boundary: 'Context boundary', other: 'Event' };
  var GLYPH = { prompt: '\u{1F4AC}', reply: '\u{1F9E0}', skill: '\u{1F9E9}', gate: '\u{1F6A6}', tool: '\u{1F527}', decision: '❓',
                write: '\u{1F4DD}', dispatch: '\u{1F680}', boundary: '✂️', other: '•' };
  var STATUSES = ['ok', 'error', 'unanswered', 'missing', 'unknown'];
  var SPEEDS = [0.5, 1, 2, 4];
  var LIMIT = 20000;
  // sel: {type:'root'} | {type:'finding', f} | {type:'event', i}; pos is the place in what is being stepped through
  var state = { trace: null, events: [], findings: [], sel: { type: 'root' }, walk: null, pos: -1, playing: false, speed: 1, timer: null,
                q: '', only: false, open: false, dup: [], shown: null };
  var $ = function (id) { return document.getElementById(id); };

  /* mask:start */
  // A net under the rule that no sensitive value is written to the trace:
  // what has the shape of a credential is masked before it is shown or
  // copied. It is a net, not the rule: it knows shapes, not meaning, and it
  // knows nothing of personal data. The file on disk is not changed by it.
  var SECRETS = [
    /-----BEGIN [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----[\s\S]*?(?:-----END [A-Z ]{0,40}PRIVATE KEY(?: BLOCK)?-----|$)/g,
    /eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}/g,

      f.path.forEach(function (s, p) {
        var e = state.events[s.i], b = btn('', '', function () { stop(); state.walk = f; build(); go(p); if (narrow()) tab('view'); });
        add(b, el('span', 'name', str(e.title)), el('span', 'ref mono', (clock(e.time) ? clock(e.time) + '  ' : '') + 'L' + str(e.line)), el('span', 'note', s.note));
        ol.appendChild(add(el('li'), b));
      });
      sec(d, 'How it happened, step by step', add(el('div', 'listcard'), ol));
    }
    var ev = list(f.evidence).filter(obj);
    if (!ev.length) sec(d, 'Evidence', el('div', 'card saw', 'No citation. This finding is unsupported and should not be here.'));
    ev.forEach(function (x) { cite(d, x.line, x.fragment, x.file); });
  }

  function viewEvent(d, e, i) {
    var f = state.walk, p = here(), seq = sequence(), k = kindOf(e);
    var meta = [p >= 0 ? 'step ' + (p + 1) + ' of ' + seq.length : '', clock(e.time), span(e.duration_ms), 'line ' + str(e.line)].filter(Boolean).join(' · ');
    setBar([el('span', 'badge k-' + k, glyph(e) + '  ' + NAME[k]), statusOf(e) ? el('span', 'tag ' + statusOf(e), statusOf(e)) : null,
      el('span', 'meta mono', meta), el('span', 'grow'),
      f ? btn('btn', 'Finding ' + (f.n + 1), function () { pick({ type: 'finding', f: f }); }) : null]);
    d.appendChild(el('h3', '', str(e.title)));
    if (f && p >= 0 && f.path[p] && f.path[p].note) sec(d, 'Why this step matters', el('div', 'card why', f.path[p].note));
    sec(d, 'The user wrote', str(e.quote) ? el('div', 'card q', e.quote) : null);
    sec(d, 'What happened', text(e.summary));
    sec(d, 'What should have happened', str(e.expected) ? el('div', 'card want', e.expected) : null);
    if (str(e.input) || str(e.result)) {
      var pair = el('div', 'pair'), a = el('div'), b = el('div');
      sec(a, 'Input', el('div', 'card', str(e.input) || 'not recorded'));
      sec(b, 'Output', el('div', 'card' + (statusOf(e) === 'error' ? ' saw' : ''), str(e.result) || 'not recorded'));
      d.appendChild(add(pair, a, b));
    }
    cite(d, e.line, e.fragment, e.file);

    var kv = el('dl', 'kv'), any = false;
    [['Time', str(e.time), 1], ['Took', span(e.duration_ms)], ['Thread', threadOf(e)], ['Skill', e.skill], ['Tool', e.tool],
     ['Result at', str(e.result_line) ? 'line ' + str(e.result_line) : ''], ['Branch', e.branch], ['Directory', e.cwd, 1],
     ['Inside', e.inside >= 0 ? str(state.events[e.inside].title) : ''],
     ['Files', list(e.files).filter(function (x) { return typeof x === 'string'; }).join('\n'), 1]].forEach(function (x) {
      if (!str(x[1])) return;
      any = true;
      add(kv, el('dt', '', x[0]), el('dd', x[2] ? 'mono' : '', str(x[1])));
    });
    if (any) sec(d, 'Attributes', add(el('div', 'card'), kv));
    if (e.links.length || e.cited.length) {
      var rows = el('div', 'listcard links');
      e.links.forEach(function (r) { rows.appendChild(eventLink(state.events[r.i], r.i, r.relation)); });
      e.cited.forEach(function (x) {
        var l = btn('', '', function () { pick({ type: 'finding', f: x }); });
        add(l, el('div', '', 'Finding ' + (x.n + 1) + ': ' + str(x.statement)), el('div', 'small', str(x.dimension)));
        rows.appendChild(l);
      });
      sec(d, 'Connected to', rows);
    }
  }

  // The inspector is redrawn only when what it shows changes, so pausing
  // keeps the reader's place.
  function renderView() {
    var d = $('detail'), s = state.sel;
    var key = s.type + ':' + (s.type === 'event' ? s.i + '/' + state.pos + '/' + (state.walk ? state.walk.n : '') : s.type === 'finding' ? s.f.n : '');
    if (key === state.shown) return;
    state.shown = key;
    var a = document.activeElement, inside = !!(a && a.closest && (a.closest('#detail') || a.closest('#bar')));
    clear(d);
    if (s.type === 'finding') viewFinding(d, s.f);
    else if (s.type === 'event' && state.events[s.i]) viewEvent(d, state.events[s.i], s.i);
    else viewRoot(d);
    $('view').scrollTop = 0;
    if (narrow() && document.body.dataset.tab === 'view') window.scrollTo(0, 0);
    var h = d.querySelector('h3');
    if (h && inside) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  }

  /* ---------- wiring ---------- */
  function keep(n) {
    if (!n) return;
    var pane = n.closest('.scroll');
    if (!pane || pane.scrollHeight <= pane.clientHeight + 1) { if (narrow() && n.offsetParent) n.scrollIntoView({ block: 'nearest' }); return; }
    var top = n.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
    if (top < pane.scrollTop + 40) pane.scrollTop = Math.max(0, top - 80);
    else if (top + n.offsetHeight > pane.scrollTop + pane.clientHeight - 20) pane.scrollTop = top + n.offsetHeight - pane.clientHeight + 80;
  }
  // build() draws the rows, hops and ticks; paint() only moves the marks, so
  // a step keeps the controls, and the focus, where they are.
  function build() {
    var a = document.activeElement, key = '';
    if (a && a.closest && a.closest('#list')) {
      key = a.dataset.f !== undefined ? '[data-f="' + Number(a.dataset.f) + '"]' : a.dataset.root ? '[data-root]' :
            a.dataset.more ? '[data-more]' : a.dataset.i !== undefined ? '[data-i="' + Number(a.dataset.i) + '"]' : '';
    }
    renderList(); renderFlow(); renderTicks();
    if (key) { var n = $('list').querySelector(key); if (n) n.focus({ preventScroll: true }); }
    paint();
  }
  function paint() {
    var s = state.sel, cur = null, curHop = null, p = here();
    Array.prototype.forEach.call($('list').querySelectorAll('.row'), function (r) {
      var on = (r.dataset.root && s.type === 'root') || (r.dataset.f !== undefined && s.type === 'finding' && Number(r.dataset.f) === s.f.n) ||
               (r.dataset.i !== undefined && s.type === 'event' && Number(r.dataset.i) === s.i);
      if (on) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current');
      if (r.dataset.i !== undefined && !r.dataset.out) r.classList.toggle('ahead', ahead(Number(r.dataset.i)));
      if (on) cur = r;
    });
    Array.prototype.forEach.call($('flow').querySelectorAll('.hop'), function (h) {
      var on = s.type === 'event' && (h.dataset.p !== undefined ? Number(h.dataset.p) === state.pos : Number(h.dataset.i) === s.i);
      if (on) h.setAttribute('aria-current', 'true'); else h.removeAttribute('aria-current');
      h.classList.toggle('ahead', s.type === 'event' && !!(state.walk || state.playing) &&
        (h.dataset.p !== undefined ? Number(h.dataset.p) : sequence().indexOf(Number(h.dataset.i))) > state.pos);
      if (on) curHop = h;
    });
    Array.prototype.forEach.call($('track').querySelectorAll('.tick'), function (t) {
      t.classList.toggle('ahead', Number(t.dataset.p) > p);
      t.classList.toggle('now', Number(t.dataset.p) === p);
    });
    renderTransport();
    renderView();
    keep(cur); keep(curHop);
    if (s.type === 'event') $('live').textContent = mask('Step ' + (state.pos + 1) + ' of ' + sequence().length + ': ' + str(state.events[s.i].title));
  }
  function remember() {
    var s = state.sel, parts = [];
    if (state.walk) parts.push('finding=' + (state.walk.n + 1));
    else if (s.type === 'finding') parts.push('finding=' + (s.f.n + 1));
    if (s.type === 'event') parts.push(state.walk ? 'step=' + (state.pos + 1) : 'event=' + (s.i + 1));
    try { history.replaceState(null, '', location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '')); } catch (e) { /* sandbox */ }
  }
  function tab(name) {
    document.body.dataset.tab = name;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-pressed', b.dataset.tab === name ? 'true' : 'false'); });
    room();
  }
  function room() { document.body.style.paddingBottom = narrow() ? ($('foot').offsetHeight + 16) + 'px' : ''; }
  // a choice made by the user: it ends any replay and, on a phone, opens the inspector
  function pick(sel) {
    stop();
    var was = state.walk;
    state.sel = sel;
    if (sel.type === 'finding') { state.walk = sel.f; state.pos = -1; }
    else if (sel.type === 'root') { state.walk = null; state.pos = -1; }
    else {
      var p = sequence().indexOf(sel.i);
      if (p < 0) { state.walk = null; p = sel.i; }
      state.pos = p;
    }
    if (narrow()) tab('view');
    remember();
    if (was !== state.walk) build(); else paint();
  }
  function pickStep(i, p) {
    if (p < 0 || !state.walk) { pick({ type: 'event', i: i }); return; }
    stop();
    go(p);
    if (narrow()) tab('view');
  }
  // a move of the playhead: it changes no tab and ends no replay
  function go(p) {
    var seq = sequence();
    if (p < 0 || p >= seq.length) return false;
    state.pos = p;
    state.sel = { type: 'event', i: seq[p] };
    remember();
    paint();
    return true;
  }
  function stop() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = null;
    if (state.playing) { state.playing = false; paint(); }
  }
  function tick() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = setTimeout(function () {
      state.timer = null;
      if (!state.playing) return;
      if (!go(state.pos + 1) || state.pos >= sequence().length - 1) { stop(); return; }
      tick();
    }, 2200 / state.speed);
  }
  function start() {
    var seq = sequence();
    if (seq.length < 2) return;
    if (here() < 0 || here() >= seq.length - 1) go(0);
    state.playing = true;
    paint();
    tick();
  }
  function replay(f) { stop(); state.walk = f; state.pos = -1; state.sel = { type: 'finding', f: f }; build(); go(0); start(); if (narrow()) tab('view'); }
  function restore() {
    var want = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (p) {
      var i = p.indexOf('=');
      if (i <= 0) return;
      try { want[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) { /* a broken pair is ignored */ }
    });
    var f = state.findings[Number(want.finding) - 1], e = Number(want.event) - 1, s = Number(want.step) - 1;
    if (f && f.path[s]) { state.walk = f; build(); go(s); }
    else if (f && state.events[e] && f.path.some(function (x) { return x.i === e; })) { state.walk = f; build(); pick({ type: 'event', i: e }); }
    else if (state.events[e]) { build(); pick({ type: 'event', i: e }); }
    else if (f) { state.walk = f; state.sel = { type: 'finding', f: f }; build(); }
    else build();
    if (want.tab === 'list' || want.tab === 'flow' || want.tab === 'view') tab(want.tab); else tab('view');
    if (want.play === '1') { if (here() >= 0 && here() < sequence().length - 1) { state.playing = true; paint(); tick(); } else start(); }
  }
  function begin(trace) {
    if (!obj(trace) || trace.schema !== 'session-trace/1' || !Array.isArray(trace.events)) {
      fail('trace.json is not a session-trace/1 file. The diagnosis report beside it holds the findings as text.');
      return;
    }
    load(trace);
    var s = trace.session || {};
    if (str(s.symptom)) document.title = 'Session trace: ' + mask(str(s.symptom)).slice(0, 60);
    icon('prev', 'M3 3h2v10H3zM13 3L6 8l7 5z');
    icon('next', 'M11 3h2v10h-2zM3 3l7 5-7 5z');
    SPEEDS.forEach(function (v) {
      var b = btn('speed', v + 'x', function () { state.speed = v; if (state.playing) tick(); renderTransport(); });
      b.dataset.v = v;
      $('speeds').appendChild(b);
    });
    renderHead();
    restore();

    $('verdict').addEventListener('click', function () { pick({ type: 'root' }); });
    $('q').addEventListener('input', function (ev) { state.q = ev.target.value; build(); });
    $('only').addEventListener('click', function () {
      state.only = !state.only; $('only').setAttribute('aria-pressed', state.only ? 'true' : 'false'); build();
    });
    $('prev').addEventListener('click', function () { stop(); go(here() - 1); if ($('prev').disabled) $('play').focus(); });
    $('next').addEventListener('click', function () { stop(); go(here() + 1); if ($('next').disabled) $('play').focus(); });
    $('play').addEventListener('click', function () { if (state.playing) stop(); else start(); });
    $('track').addEventListener('click', function (ev) {
      var seq = sequence(), r = $('track').getBoundingClientRect();
      if (!seq.length || !r.width) return;
      stop();
      go(Math.max(0, Math.min(seq.length - 1, Math.round(((ev.clientX - r.left) / r.width * 100 - 2) / 96 * (seq.length - 1)))));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
      b.addEventListener('click', function () { tab(b.dataset.tab); window.scrollTo(0, 0); });
    });
    window.addEventListener('resize', room);
    document.addEventListener('keydown', function (ev) {
      if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
      var t = ev.target && ev.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if (ev.key === ' ') { if (t === 'BUTTON' || t === 'SUMMARY') return; ev.preventDefault(); if (state.playing) stop(); else start(); }
      else if (ev.key === 'ArrowRight') { ev.preventDefault(); stop(); go(here() < 0 ? 0 : here() + 1); }
      else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stop(); go(here() - 1); }
      else if (ev.key === 'Escape') { pick({ type: 'root' }); }
    });
  }

  fetch('trace.json', { cache: 'no-store', credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.text(); })
    .then(function (raw) {
      var trace;
      try { trace = JSON.parse(raw); }
      catch (e) { fail('trace.json is not valid JSON, so the page cannot show it. The diagnosis report beside it holds the findings as text.'); return; }
      try { begin(trace); }
      catch (e) { fail('trace.json was read, but the page could not show it. The diagnosis report beside it holds the findings as text.'); }
    }, function () {
      fail('trace.json could not be read. Open this page through the preview URL, not as a file, and check that trace.json sits beside it.');
    });
})();
</script>
</body>
</html>
