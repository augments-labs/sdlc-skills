name: validate-skills

# The deterministic gate for this library's authoring rules (see CLAUDE.md):
# no external references, no vendor model names, line budgets, frontmatter
# shape, and plugin-manifest sync. The rules live in scripts/sh/validate-skills.sh;
# this workflow is what makes them *enforced* rather than merely documented.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation (skills + adapter sync)
        run: bash scripts/sh/validate-skills.sh
      # Nothing under tests/optimizing/ is checked here, by design. That corpus
      # exists to tune descriptions, and its state is not a correctness claim
      # about the library — a red sheet there is a number, not a regression.
      - name: Session-start router injection
        run: bash tests/run-session-start.sh
      - name: Governed localhost preview (serve.py + wrappers)
        run: bash tests/run-serve-preview.sh
      - name: Token budget (always-loaded surface)
        run: bash scripts/sh/token-budget.sh --max 5000
