name: validate-skills

# The deterministic gate for this library's authoring rules (see CLAUDE.md):
# no external references, no vendor model names, line budgets, frontmatter
# shape, and plugin-manifest sync. The rules live in scripts/sh/validate-skills.sh;
# this workflow is what makes them *enforced* rather than merely documented.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation (skills + adapter sync)
        run: bash scripts/sh/validate-skills.sh
      # Live evidence is not checked here, by design: behavioral scenarios and
      # description query sets live in the evals lab,
      # [sdlc-skills-evals](https://github.com/augments-labs/sdlc-skills-evals),
      # cost tokens, and sample a non-deterministic agent, so they never run in CI.
      - name: Session-start router injection
        run: bash tests/run-session-start.sh
      - name: Governed localhost preview (serve.py + wrappers)
        run: bash tests/run-serve-preview.sh
      - name: Token budget (always-loaded surface)
        run: bash scripts/sh/token-budget.sh --max 5000

  reference-validator:
    # A parser cross-check with the Agent Skills reference validator, never a
    # gate: a differing verdict is investigated (docs/agent-skills-conformance.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the reference validator
        run: pip install skills-ref==0.1.1
      - name: Validate every skill directory
        run: |
          {
            echo "## Reference validator cross-check"
            echo
            for dir in skills/*/*/; do
              case "$dir" in *[!a-z0-9/-]*) echo "- skipped: a directory name outside [a-z0-9-]"; continue;; esac
              if out=$(agentskills validate "$dir" 2>&1); then
                echo "- valid: \`$dir\`"
              else
                echo "- differs: \`$dir\`"
                echo
                echo '````text'
                printf '%s\n' "$out" | tr -d '`'
                echo '````'
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
