name: validate-skills

# The deterministic gate for this library's authoring rules (see AGENTS.md):
# no external references, no vendor model names, line budgets, frontmatter
# shape, and plugin-manifest sync. The rules live in scripts/sh/validate-skills.sh;
# this workflow is what makes them *enforced* rather than merely documented.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation (skills + adapter sync)
        run: bash scripts/sh/validate-skills.sh --strict
      # No live agent runs here: every step below is deterministic.
      - name: Session-start router injection
        run: bash tests/run-session-start.sh
      - name: Governed localhost preview (serve.py + wrappers)
        run: bash tests/run-serve-preview.sh
      - name: Local git hook installer (scripts/sh/install-git-hooks.sh)
        run: bash tests/run-git-hooks.sh
      - name: State identity (in-repository and non-repository modes)
        run: bash tests/run-state-identity.sh
      - name: Token budget (always-loaded surface)
        run: bash scripts/sh/token-budget.sh --max 5000
      - name: Handoff cycles
        run: bash scripts/sh/validate-skill-graph.sh --strict
      - name: Chain budgets (scripts/sh/data/chains.toml)
        run: |
          chains=$(sed -n 's/^\[\([a-z0-9-]*\)\]$/\1/p' scripts/sh/data/chains.toml)
          [ -n "$chains" ] || { echo "no chains in scripts/sh/data/chains.toml"; exit 1; }
          fail=0
          for chain in $chains; do
            bash scripts/sh/token-budget.sh --chain "$chain" || fail=1
          done
          exit "$fail"
      # Descriptions are PR content; the runner must not read shared clauses as workflow commands.
      - name: Trigger collisions
        run: |
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          bash scripts/sh/validate-trigger-collisions.sh --strict

  reference-validator:
    # A parser cross-check with the Agent Skills reference validator, never a
    # gate: a differing verdict is investigated (docs/agent-skills-conformance.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the reference validator
        run: pip install skills-ref==0.1.1
      - name: Validate every skill directory
        run: |
          # The validator echoes skill content; the runner must not read it as workflow commands.
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          trap 'echo "::$token::"' EXIT
          {
            echo "## Reference validator cross-check"
            echo
            for dir in skills/*/*/; do
              case "$dir" in *[!a-z0-9/-]*) echo "- skipped: a directory name outside [a-z0-9-]"; continue;; esac
              if out=$(agentskills validate "$dir" 2>&1); then
                echo "- valid: \`$dir\`"
              else
                echo "- differs: \`$dir\`"
                echo
                echo '````text'
                printf '%s\n' "$out" | tr -d '`'
                echo '````'
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
